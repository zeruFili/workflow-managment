## 1. System Architecture

### 1.1 High-Level Architecture

```
Frontend (React SPA + HashRouter + Vite)
        |
        v
Backend API Gateway (Node.js NestJS or Python FastAPI)
    - Auth Module (JWT + RBAC Middleware)
    - Rate Limiter
    - Business Logic Services
        |
    ┌───┼───┐
    v   v   v
PostgreSQL  S3/MinIO   Redis
(Primary)  (Files)    (Cache/Jobs)
```

### 1.2 Technology Stack

| Layer | Technology |
|-------|-----------|
| Backend | Node.js 20+ (NestJS) or Python 3.12+ (FastAPI) |
| Database | PostgreSQL 16+ with JSONB support |
| ORM | TypeORM / Prisma / SQLAlchemy |
| Cache/Queue | Redis 7+ with BullMQ / Celery |
| File Storage | AWS S3 / MinIO with signed URLs |
| Auth | JWT access tokens (15min) + refresh tokens (7 days, httpOnly cookie) |
| Realtime | Socket.IO / WebSocket for notifications |
| Search | PostgreSQL tsvector or Elasticsearch |

### 1.3 API Conventions

| Convention | Detail |
|------------|--------|
| Base URL | `/api/v1` |
| Content Type | `application/json` (files: `multipart/form-data`) |
| Auth Header | `Authorization: Bearer <access_token>` |
| Refresh Token | `httpOnly` cookie named `refresh_token` |
| Pagination | `?page=1&limit=20` → `{ data: [], meta: { total, page, limit, totalPages } }` |
| Sorting | `?sortBy=field&order=asc|desc` |
| Error Format | `{ error: { code: string, message: string, details?: any } }` |
| HTTP Codes | 200, 201, 204, 400, 401, 403, 404, 409, 422, 429, 500 |

## 2. Data Models

### 2.1 PostgreSQL Enumerated Types

```sql
CREATE TYPE user_role AS ENUM (
  'ceo','general_manager','marketing_lead','finance_officer',
  'data_collector','quantity_surveyor','designer','site_engineer','system_administrator'
);

CREATE TYPE task_status AS ENUM (
  'pending','in_progress','completed','incomplete','rejected'
);

CREATE TYPE approval_status AS ENUM ('pending','approved','rejected');
CREATE TYPE payment_verification_status AS ENUM (
  'pending','verified','approved','rejected','request_clarification'
);
CREATE TYPE designer_task_application_status AS ENUM ('pending','assigned','rejected');
CREATE TYPE designer_phase AS ENUM ('case_study','design_stage','rendering','final_stage');
CREATE TYPE review_action AS ENUM ('approved','rejected','feedback','request_clarification');
CREATE TYPE qs_recommendation AS ENUM ('recommend_approval','recommend_revision');
CREATE TYPE qs_review_status AS ENUM ('pending_review','in_review','record_submitted');
CREATE TYPE qs_decision AS ENUM ('pending','approved','feedback');
CREATE TYPE project_stage AS ENUM ('lead','design','approval','execution','completed');
CREATE TYPE project_status AS ENUM ('active','on_hold','completed');
CREATE TYPE customer_request_category AS ENUM ('home_design','finishing_work','hair_salon_design','other');
CREATE TYPE customer_request_status AS ENUM ('new','in_review','scheduled','closed');

CREATE TYPE notification_type AS ENUM (
  'customer_created','payment_submitted','payment_reviewed',
  'payment_clarification_requested','payment_clarification_responded',
  'task_assigned','task_submitted','task_reviewed',
  'designer_application','designer_assigned',
  'designer_phase_submitted','designer_phase_reviewed',
  'designer_paused','designer_resumed','designer_final_evaluated',
  'qs_task_assigned','qs_evaluation_submitted','qs_evaluation_reviewed',
  'data_collector_submitted','data_collector_reviewed',
  'site_engineer_submitted','site_engineer_reviewed',
  'user_created','user_updated','user_deleted','system_announcement'
);
```

## 3. Authentication & Authorization

### F-AUTH-001: User Login

| Aspect | Detail |
|--------|--------|
| **Function ID** | F-AUTH-001 |
| **Description** | Authenticate user with username+password. Returns JWT access + refresh tokens. |
| **Roles** | Public |
| **Endpoint** | `POST /api/v1/auth/login` |

**Input:**

| Field | Type | Required | Validation | Example |
|-------|------|----------|------------|---------|
| username | String | Yes | 3-100 chars, alphanumeric + _ . - | `john_doe` |
| password | String | Yes | 8-128 chars | `P@ssw0rd!2026` |

**Output (200):**
```json
{
  "accessToken": "eyJhbGciOi...",
  "refreshToken": "dGhpcyBp...",
  "user": { "id": "uuid", "username": "john_doe", "name": "John Doe", "role": "designer" }
}
```

**Business Rules:**
- Account must be active (`is_active = true`)
- Rate limit: 5 failed attempts per 15 min per IP; 5th failure locks account 30 min
- Password hashed with bcrypt (cost factor 12)
- Last login timestamp updated on success
- If `force_password_change = true`, response includes `forcePasswordChange: true`

**Audit:** Action `login_success` / `login_failed` / `account_locked`. IP + user agent logged.

**Frontend:** Username field, Password field (masked), Login button, Loading state, Error display.

---

### F-AUTH-002: Token Refresh

| Aspect | Detail |
|--------|--------|
| **Function ID** | F-AUTH-002 |
| **Endpoint** | `POST /api/v1/auth/refresh` |

**Input:** `{ refreshToken: string }` (also accepted from httpOnly cookie)

**Output:** `{ accessToken: string, refreshToken: string }` (rotated)

**Business Rules:**
- Old refresh token revoked on use
- Refresh tokens expire after 7 days
- If a revoked refresh token is used → revoke ALL tokens for that user (fraud detection)
- Access token claims: `{ sub: userId, role: userRole, iat, exp }`

---

### F-AUTH-003: Logout

| Aspect | Detail |
|--------|--------|
| **Function ID** | F-AUTH-003 |
| **Endpoint** | `POST /api/v1/auth/logout` |
| **Auth** | Bearer token |

**Output:** 204 No Content

**Business Rules:** Revokes specific refresh token. Optional `{ allDevices: true }` to revoke all user tokens.

---

### F-AUTH-004: Forgot Password

| Aspect | Detail |
|--------|--------|
| **Function ID** | F-AUTH-004 |
| **Endpoint** | `POST /api/v1/auth/forgot-password` |
| **Input** | `{ email: string }` |

**Output:** Always `{ message: "If the email exists, a reset link has been sent." }` (prevents enumeration)

**Business Rules:** Generate unique token (hashed), expire 1 hour, send email with link.

---

### F-AUTH-005: Reset Password

| Aspect | Detail |
|--------|--------|
| **Function ID** | F-AUTH-005 |
| **Endpoint** | `POST /api/v1/auth/reset-password` |
| **Input** | `{ token: string, newPassword: string }` |

**Output:** `{ message: "Password reset successfully." }`

**Business Rules:**
- New password must differ from last 3 passwords
- Must include uppercase + lowercase + digit + special char (8-128 chars)
- Token single-use; all existing refresh tokens revoked after reset
- Mark `force_password_change = false`

---

### F-AUTH-006: RBAC Middleware

Every endpoint checks JWT role claim against allowed roles. CEO inherits all GM permissions.

**Error Responses:**
- 401 `TOKEN_EXPIRED` → frontend should refresh token
- 403 `FORBIDDEN` → role not permitted
- 401 `INVALID_TOKEN` → re-login required

### F-FIN-002: Verify Paid Customer Payment

| Aspect | Detail |
|--------|--------|
| **Function ID** | F-FIN-002 |
| **Description** | Finance reviews payment proof and sets verification status. One payment can have many reviews. |
| **Roles** | `finance_officer`, `ceo` |
| **Endpoint** | `POST /api/v1/paid-customers/{id}/verify` |

**Input:**

| Field | Type | Required | Validation | Example |
|-------|------|----------|------------|---------|
| action | Enum | Yes | approve|reject|request_clarification | `approve` |
| message | String | Cond. | Required for reject + clarification. Max 5000 | `Payment verified` |

**Output (200):**
```json
{
  "id": "pc-uuid",
  "paymentVerificationStatus": "approved",
  "paymentVerifiedBy": "uuid",
  "paymentVerifiedByName": "Lisa Martinez",
  "paymentVerifiedAt": "2026-05-30T14:00:00Z",
  "verificationHistory": [
    { "action": "approved", "reviewerName": "Lisa Martinez", "message": "...", "reviewedAt": "..." }
  ]
}
```

**Business Rules:**
- `approve` → status `approved`; `reject` → status `rejected` (message required); `request_clarification` → status `request_clarification` (message required)
- Each verification creates a history record (one-to-many: one payment, many reviews)
- History is append-only — never overwrite
- CEO can override any finance decision
- If already `approved`, only CEO can change

**Notifications:**
- Notify the Marketing Lead who transferred the record
- Type: `payment_reviewed`
- Title: "Payment {Approved|Rejected|Needs Clarification}"
- Body: "{reviewerName} has {action} the payment for {customerName}. {message}"

**Audit:** Action `payment_verified` / `payment_rejected` / `payment_clarification_requested`.

**Frontend:** Detail view showing proofs (image preview, download), verification history timeline. Action form: radio (Approve/Reject/Clarification), conditional message textarea, Submit. Confirmation modal. Disable if already approved (CEO override toggle).

### F-CEO-014: Review Designer Phase Submission

| Aspect | Detail |

| **Roles** | `ceo`, `general_manager` |
| **Endpoint** | `POST /api/v1/designer-tasks/{id}/phases/{phase}/review` |

**Input:**

| Field | Type | Required | Validation | Example |
|-------|------|----------|------------|---------|
| action | Enum | Yes | approved|feedback|rejected | `approved` |
| message | String | Yes | 5-5000 chars | `Looks good, proceed` |

**Output (200):**
```json
{
  "phase": "design_stage",
  "action": "approved",
  "reviewerName": "Ava Reynolds (CEO)",
  "message": "Looks good, proceed to next phase",
  "reviewedAt": "2026-05-30T14:00:00Z",

## 13. Notification System

### 13.1 System Overview

The notification system operates on two tiers:
1. **Server-side**: PostgreSQL `notifications` table — one record per recipient per event
2. **Client-side**: `CustomEvent` bus via `window.dispatchEvent(...)` for real-time badge updates

### 13.2 Notification Lifecycle

```
Action occurs (e.g., payment_submitted)
    |
    v
Server creates 1 notification record PER recipient role user
    |
    v
WebSocket push to connected clients AND stored in DB
    |
    v
Frontend receives CustomEvent → updates badge count
    |
    v
User views notification → PATCH /api/v1/notifications/{id}/read
    |
    v
Read notifications persist but show readAt timestamp
```

### 13.3 Client-Side Notification Bus

Pages publish badge counts via `window.dispatchEvent(new CustomEvent(...))`. The Layout component listens and updates sidebar badges.

**Published Events:**

| Event Name | Publisher | Payload |
|------------|-----------|---------|
| `paid-customers-notifications-updated` | PaidCustomers page | `{ detail: number }` |
| `data-collector-notifications-updated` | DataCollectorTasks page | `{ detail: number }` |
| `quantity-surveyor-notifications-updated` | QS Dashboard / QS Tasks | `{ detail: number }` |
| `finance-verifications-notifications-updated` | FinanceVerifications page | `{ detail: number }` |
| `approvals-notifications-updated` | Approvals page | `{ detail: number }` |
| `open-job-postings-notifications-updated` | DesignerOpenJobPostings page | `{ detail: number }` |
| `designer-assignments-notifications-updated` | DesignerAssignments page | `{ detail: number }` |
| `designer-tasks-notifications-updated` | DesignerTasks page | `{ detail: number }` |
| `site-engineer-notifications-v2` | SiteEngineerTasks page | `{ detail: number }` |

### 13.4 Read/Unread Behavior

- **IntersectionObserver**: Cards marked "viewed" only when >=70% visible in viewport
- **In-memory tracking**: `Set<string>` tracks seen card IDs within session
- **On unmount**: Seen IDs persist to viewed set; badge count recalculated
- **Badge counts**: Published on mount and unmount via CustomEvent

## 14. Performance Rating System

### 14.1 Rating Model

Each completed designer task receives one rating with scores across 5+1 dimensions:

| Dimension | Scale | Description |
|-----------|-------|-------------|
| `overallRating` | 0.0 – 5.0 | Composite overall performance |
| `renderingQuality` | 0.0 – 5.0 | Quality of 3D rendering/viz output |
| `timeliness` | 0.0 – 5.0 | On-time delivery |
| `creativity` | 0.0 – 5.0 | Creative approach and innovation |
| `clientUnderstanding` | 0.0 – 5.0 | Adherence to client requirements |
| `revisionEfficiency` | 0.0 – 5.0 | Efficiency in handling revisions (inverse of revisionCount) |

### 14.2 Rating Statuses

| Status | Meaning |
|--------|---------|
| `approved` | Rating finalized, visible to designer |
| `rejected` | Rating rejected (error in evaluation) |
| `in_review` | Rating under review, not yet visible |

## 15. Audit Trail System

### 15.1 Overview

Every state-changing operation creates an immutable audit log entry. The `audit_logs` table captures who did what, to which entity, at what time, with a JSON diff of changes.

### 15.2 Audit Log Schema

| Column | Type | Purpose |
|--------|------|---------|
| `id` | UUID PK | Unique identifier |
| `user_id` | UUID FK → users | Actor (SET NULL on delete) |
| `user_name` | VARCHAR(255) | Denormalized actor name |
| `user_role` | user_role | Actor's role at time of action |
| `action` | VARCHAR(100) | Action name (e.g., `task_created`, `payment_verified`) |
| `entity_type` | VARCHAR(50) | Affected table/model |
| `entity_id` | UUID | Affected record ID |
| `changes` | JSONB | Diff of old vs new values |
| `ip_address` | VARCHAR(45) | Client IP |
| `user_agent` | TEXT | HTTP User-Agent |
| `created_at` | TIMESTAMPTZ | When action occurred |

### 15.3 Audited Actions

| Category | Actions |
|----------|---------|
| Auth | `login_success`, `login_failed`, `account_locked`, `logout`, `token_refresh`, `password_reset` |
| Users | `user_created`, `user_updated`, `user_deleted`, `user_role_changed`, `user_status_changed` |
| Customers | `customer_request_created`, `customer_request_updated`, `customer_request_deleted`, `customer_request_transferred_to_paid` |
| Finance | `payment_submitted`, `payment_verified`, `payment_rejected`, `payment_clarification_requested`, `payment_clarification_responded`, `payment_override` |
| Tasks | `task_created`, `task_updated`, `task_deleted`, `task_status_changed`, `task_assigned`, `task_reviewed` |
| Designer | `designer_task_created`, `designer_task_assigned`, `designer_phase_submitted`, `designer_phase_reviewed`, `designer_task_paused`, `designer_task_resumed` |
| Ratings | `designer_rating_created`, `designer_rating_updated`, `designer_rating_status_changed` |
| QS | `qs_review_task_created`, `qs_task_accepted_for_review`, `qs_evaluation_submitted`, `qs_evaluation_updated`, `qs_evaluation_decided` |
| Data Collector | `data_collector_task_created`, `data_collector_task_reviewed`, `data_collector_submission_created` |
| Site Engineer | `site_engineer_task_status_updated`, `site_engineer_task_description_updated`, `site_engineer_attachment_uploaded` |
| System | `system_config_updated`, `audit_log_exported`, `system_announcement_created` |

### 15.4 API Endpoints

#### F-AUDIT-001: Query Audit Logs

| Aspect | Detail |
|--------|--------|
| **Function ID** | F-AUDIT-001 |
| **Roles** | `system_administrator`, `ceo` |
| **Endpoint** | `GET /api/v1/audit-logs` |

**Query Parameters:** Same as F-SYS-002.

**Output:** `{ data: AuditLog[], meta: { total, page, limit, totalPages }, summary: {...} }`

#### F-AUDIT-002: Export Audit Logs

| Aspect | Detail |
|--------|--------|
| **Function ID** | F-AUDIT-002 |
| **Roles** | `system_administrator` |
| **Endpoint** | `GET /api/v1/audit-logs/export?format=csv&startDate=2026-01-01&endDate=2026-05-30` |

**Output:** CSV or JSON file download.

#### F-AUDIT-003: Get Audit Log Summary

| Aspect | Detail |
|--------|--------|
| **Function ID** | F-AUDIT-003 |
| **Roles** | `system_administrator`, `ceo` |
| **Endpoint** | `GET /api/v1/audit-logs/summary?period=month` |

**Output:**
```json
{
  "totalActions": 1253,
  "uniqueUsers": 12,
  "uniqueEntities": 89,
  "actionBreakdown": { "task_created": 340, "payment_verified": 85, ... },
  "userBreakdown": [{ "userName": "Ava Reynolds", "actionCount": 245 }, ...]
}
```

### 15.5 Business Rules

- BR-AUDIT-001: All audit entries immutable — no update or delete operations
- BR-AUDIT-002: `changes` column stores JSON diff (deep object comparison)
- BR-AUDIT-003: Passwords and tokens NEVER stored in audit log
- BR-AUDIT-004: Audit logs auto-archived to cold storage after retention period (configurable, default 365 days)
- BR-AUDIT-005: Audit log queries rate-limited (30 req/min for CEO, 120 req/min for sysadmin)
- BR-AUDIT-006: All export operations themselves are audited

### 15.6 Retention & Compliance

- Default retention: 365 days (configurable via System Config)
- Archive to S3 cold storage (Glacier) after retention period
- GDPR/Data protection: audit logs exclude PII from changes diff (mask customer_name, email, phone)
- Chain of custody preserved via sequential IDs and timestamps
- Audit log integrity check via periodic hash verification

### 17.4 Notification Badge System

Each page tracks "unseen" items via a `Set<string>` and publishes badge counts via `window.dispatchEvent(new CustomEvent(...))`. The Layout component listens to these events and updates sidebar badge counters.

**Pattern per page:**
1. Define `HIGHLIGHTED_IDS` constant
2. Track seen IDs in in-memory `Set` (persists across route changes, resets on refresh)
3. Use `IntersectionObserver` (threshold 0.7) to detect when cards enter viewport
4. On component unmount, persist seen IDs and publish updated badge count
5. Highlighted cards get blue border, ring, and "New" badge

### 17.7 Seed Data Bootstrapping

On first load (localStorage key missing), seed data from `src/app/data/mockData.ts` and page-specific seed arrays are written to localStorage. On subsequent loads, existing records are merged with seed data so user changes are preserved while new seed entries are picked up. Pattern:

```typescript
const saved = localStorage.getItem(KEY);
const parsed = saved ? JSON.parse(saved) : null;
const merged = parsed
  ? [...parsed.map(item => ({ ...seedItem, ...item })), ...seedOnlyInSeed]
  : seedData;
localStorage.setItem(KEY, JSON.stringify(merged));
```

<script>
(function() {
  const md = document.getElementById('markdown-content').textContent;
  const content = document.getElementById('content');
  const tocList = document.getElementById('toc-list');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const hamburger = document.getElementById('hamburger');
  const backToTop = document.getElementById('back-to-top');

  marked.setOptions({ breaks: false, gfm: true });

  let html = marked.parse(md);

  content.innerHTML = html;

  // Build TOC
  const headings = content.querySelectorAll('h1, h2, h3');
  let tocItems = [];
  headings.forEach((h, i) => {
    const id = h.id || ('section-' + i);
    h.id = id;
    const level = h.tagName.toLowerCase();
    tocItems.push({ id, text: h.textContent.trim(), level });
  });

  tocItems.forEach(item => {
    const li = document.createElement('li');
    li.className = 'toc-item';
    const a = document.createElement('a');
    a.href = '#' + item.id;
    a.className = 'toc-link ' + (item.level === 'h2' ? 'toc-h2' : item.level === 'h3' ? 'toc-h3' : 'toc-h1');
    a.textContent = item.text;
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(item.id);
      if (target) { target.scrollIntoView({ behavior: 'smooth' }); }
      if (window.innerWidth <= 860) { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
    });
    li.appendChild(a);
    tocList.appendChild(li);
  });

  // Scroll spy
  const tocLinks = tocList.querySelectorAll('.toc-link');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        tocLinks.forEach(link => link.classList.remove('active'));
        const match = tocList.querySelector('a[href="#' + entry.target.id + '"]');
        if (match) match.classList.add('active');
      }
    });
  }, { rootMargin: '-80px 0px -70% 0px' });
  headings.forEach(h => observer.observe(h));

  // Mobile
  hamburger.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
  });
  overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  });

  // Back to top
  window.addEventListener('scroll', () => {
    backToTop.classList.toggle('visible', window.scrollY > 400);
  });
  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Style inner content
  content.querySelectorAll('pre code').forEach(block => {
    if (block.parentElement.tagName === 'PRE') {
      const lang = block.className ? block.className.replace('language-','') : '';
      if (lang === 'sql') {
        block.innerHTML = block.innerHTML
          .replace(/\b(CREATE|TABLE|TYPE|ENUM|AS|DEFAULT|NOT|NULL|PRIMARY|KEY|FK|REFERENCES|CASCADE|SET|ON|DELETE|UPDATE|VARCHAR|TEXT|BOOLEAN|INTEGER|BIGINT|NUMERIC|JSONB|TIMESTAMPTZ|CHECK|UNIQUE|now|gen_random_uuid)\b/g,'<span style="color:#93c5fd">$1</span>')
          .replace(/'([^']*)'/g,"<span style='color:#86efac'>'$1'</span>")
          .replace(/--.*$/gm,"<span style='color:#6b7280'>$&</span>");
      } else if (lang === 'json') {
        block.innerHTML = block.innerHTML
          .replace(/"([^"]+)":/g,'<span style="color:#93c5fd">"$1"</span>:')
          .replace(/: "([^"]*)"/g,': <span style="color:#86efac">"$1"</span>')
          .replace(/: (\d+\.?\d*)/g,': <span style="color:#fbbf24">$1</span>')
          .replace(/: (true|false)/g,': <span style="color:#c084fc">$1</span>');
      }
    }
  });

})();
</script>
